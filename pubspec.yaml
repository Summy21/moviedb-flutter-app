name: moviedb_flutter_app
description: Flutter movie and TV catalog app built with Clean Architecture and TMDB API. Equifax Technical Test 2026.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Dependency injection
  get_it: ^9.2.1

  # HTTP client
  dio: ^5.7.0

  # Image caching
  cached_network_image: ^3.4.1

  # Navigation
  go_router: ^17.2.3

  # Code generation — immutable states
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Functional error handling
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Static analysis and linting
  flutter_lints: ^6.0.0

  # Code generators
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  freezed: ^3.2.5

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true